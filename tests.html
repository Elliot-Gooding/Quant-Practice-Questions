<!doctype html><meta charset="utf-8"><title>Quant practice — self checks</title>
<style>body{background:#0f1b2d;color:#e8edf5;font:14px/1.5 ui-monospace,Consolas,monospace;padding:2rem}
pre{white-space:pre-wrap}</style>
<body><h1 style="font:400 20px Georgia,serif">Self checks</h1><pre id="out">running...</pre>
<!-- Sandboxed storage key: Chrome shares localStorage across file:// pages, so
     without this the checks below would wipe real practice history. -->
<script>window.QSTORE_KEY = "quant-practice:selftest";</script>
<script src="bank.js"></script>
<script src="validate-core.js"></script>
<script src="formats.js"></script>
<script src="questions/questions.js"></script>
<script src="questions/questions-maven.js"></script>
<script src="store.js"></script>
<script>
const log = [];
const check = (name, got, want) => log.push(
  (JSON.stringify(got) === JSON.stringify(want) ? "PASS  " : "FAIL  ") +
  name + (JSON.stringify(got) === JSON.stringify(want) ? "" : "   got " + JSON.stringify(got) + " want " + JSON.stringify(want)));

QStore.reset();
log.push("persistent storage: " + QStore.persistent);

const qs = QBank.all();
const a = qs[0], b = qs[1], c = qs[2];

// a: wrong then correct.  b: always wrong.  c: correct but slow.
QStore.recordAttempt({ qid: a.id, mode: "practice", outcome: "wrong",   timeMs: 30000 });
QStore.recordAttempt({ qid: a.id, mode: "practice", outcome: "correct", timeMs: 20000, hintUsed: true });
QStore.recordAttempt({ qid: b.id, mode: "test", outcome: "wrong", answered: 2, timeMs: 40000, testId: "t1" });
QStore.recordAttempt({ qid: b.id, mode: "practice", outcome: "wrong", timeMs: 50000 });
QStore.recordAttempt({ qid: c.id, mode: "practice", outcome: "correct", timeMs: (c.time * 1000) + 60000 });

const sa = QStore.questionStats(a.id, a);
check("a seen", sa.seen, 2);
check("a accuracy", sa.accuracy, 0.5);
check("a median ms", sa.medianTimeMs, 25000);
check("a hint rate", sa.hintRate, 0.5);

check("a needsReview (last was correct, inside target)", QStore.needsReview(a), false);
check("b needsReview (last wrong)", QStore.needsReview(b), true);
check("c needsReview (correct but over target)", QStore.needsReview(c), true);
check("untouched needsReview", QStore.needsReview(qs[10]), false);

const o = QStore.overallStats(qs);
check("attempted", o.attempted, 3);
check("bank size", o.bankSize, qs.length);
check("review count", o.reviewCount, 2);
check("weakest first is b", o.weakest[0].q.id, b.id);
check("slowest first is c", o.slowest[0].q.id, c.id);
check("ungraded excluded from accuracy", QStore.questionStats(qs[10].id, qs[10]).accuracy, null);

// cursors keyed per filter
QStore.setCursor({ category: "logic" }, 7);
check("cursor logic", QStore.getCursor({ category: "logic" }), 7);
check("cursor other filter independent", QStore.getCursor({ category: "probability" }), 0);

// export / import round trip
const dump = QStore.exportJSON();
QStore.reset();
check("reset clears", QStore.attempts().length, 0);
const r1 = QStore.importJSON(dump);
check("import ok", r1.ok, true);
check("import added all", r1.added, 5);
check("import restored stats", QStore.questionStats(a.id, a).accuracy, 0.5);
check("import restored cursor", QStore.getCursor({ category: "logic" }), 7);
const r2 = QStore.importJSON(dump);
check("re-import is idempotent", [r2.added, r2.skipped], [0, 5]);
check("bad json rejected", QStore.importJSON("{nope").ok, false);
check("wrong shape rejected", QStore.importJSON('{"hello":1}').ok, false);
check("rejected import left data intact", QStore.attempts().length, 5);

QStore.reset();
document.getElementById("out").textContent = log.join("\n") +
  "\n\n" + log.filter(l => l.startsWith("FAIL")).length + " failure(s)";
</script>
