<script>
/* Synthetic questions the view tests drive, in their own category so the real
   bank cannot make the assertions flaky. */
QBank.add([
  { id: "st-mc", category: "selftest", difficulty: 1, time: 60,
    question: `Which is two?`, hint: `Count.`, solution: `It is two.`,
    options: [`one`, `two`, `three`, `four`], answer: 1 },
  { id: "st-free-1", category: "selftest", difficulty: 1, time: 60,
    question: `Free response one`, hint: `A hint.`, solution: `A solution.` },
  { id: "st-free-2", category: "selftest", difficulty: 1, time: 60,
    question: `Free response two`, hint: `A hint.`, solution: `A solution.` },

  /* Three more multiple-choice questions, enough to sit the synthetic papers
     below. Their correct option is at a different index each time, so a bug
     that assumed a fixed position would show up.

     Six options, matched by a six-option format, because eligibility is by
     option count alone: with five they would share a pool with the real Maven
     questions and the paper would stop being deterministic. */
  { id: "st-q1", category: "selftest-test", difficulty: 1, time: 20,
    question: `Pick alpha`, solution: `alpha`,
    options: [`alpha`, `beta`, `gamma`, `delta`, `epsilon`, `zeta`], answer: 0 },
  { id: "st-q2", category: "selftest-test", difficulty: 1, time: 20,
    question: `Pick gamma`, solution: `gamma`,
    options: [`alpha`, `beta`, `gamma`, `delta`, `epsilon`, `zeta`], answer: 2 },
  { id: "st-q3", category: "selftest-test", difficulty: 1, time: 20,
    question: `Pick epsilon`, solution: `epsilon`,
    options: [`alpha`, `beta`, `gamma`, `delta`, `epsilon`, `zeta`], answer: 4 },
]);

/* A separate pool for the paper-selection checks: five questions, seven
   options, so it can never overlap the six-option pool above or anything real. */
QBank.add([1, 2, 3, 4, 5].map(n => ({
  id: "st-d" + n,
  category: "selftest-draw",
  difficulty: 1,
  time: 20,
  question: `Draw fixture ${n}`,
  solution: `Fixture ${n}.`,
  options: [`a`, `b`, `c`, `d`, `e`, `f`, `g`],
  answer: 0,
})));

const WORDS = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta"];
const DRAW_ALL = ["st-d1", "st-d2", "st-d3", "st-d4", "st-d5"];
const DRAW_SEEN = ["st-d1", "st-d2", "st-d3"];
const DRAW_UNSEEN = ["st-d4", "st-d5"];

QFormats.add([
  { id: "selftest-free", name: "Self test — free navigation", questionCount: 3,
    timeLimitSec: 600, optionCount: 6,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "free", allowFlagging: true },
  { id: "selftest-linear", name: "Self test — linear", questionCount: 3,
    timeLimitSec: 600, optionCount: 6,
    marking: { correct: 1, incorrect: 0, skipped: 0 },
    navigation: "linear", allowFlagging: false },

  { id: "selftest-draw", name: "Self test — draw", questionCount: 3,
    timeLimitSec: 600, optionCount: 7,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "free", allowFlagging: true },
  { id: "selftest-draw-weighted", name: "Self test — draw, weighted", questionCount: 3,
    timeLimitSec: 600, optionCount: 7,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "free", allowFlagging: true,
    categoryWeights: { "selftest-draw": 3 } },

  /* The same seven-option pool, fenced by category both ways. */
  { id: "selftest-allow", name: "Self test — allow-list", questionCount: 3,
    timeLimitSec: 600, optionCount: 7,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "free", allowFlagging: true, categories: ["selftest-draw"] },
  { id: "selftest-block", name: "Self test — block-list", questionCount: 3,
    timeLimitSec: 600, optionCount: 7,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "free", allowFlagging: true, excludeCategories: ["selftest-draw"] },

  /* A generated, answer-is-final paper, driven by the stub generator below. */
  { id: "selftest-sprint", name: "Self test — sprint", questionCount: 4,
    timeLimitSec: 600, optionCount: 4,
    marking: { correct: 1, incorrect: -1, skipped: 0 },
    navigation: "linear", mustAnswer: true, allowFlagging: false,
    generator: "selftest-gen" },
]);

/* A generator whose right answer is always the option reading 2. */
QGenerators.add({
  id: "selftest-gen",
  name: "Self test generator",
  make(count) {
    const out = [];
    for (let i = 1; i <= count; i++)
      out.push({
        id: "st-gen-" + i, category: "selftest-gen", breakdown: i % 2 ? "odd" : "even", time: 6,
        generated: true, question: `Sprint ${i}: 1 + 1`, solution: `2`,
        options: [`1`, `2`, `3`, `4`], answer: 1,
        check: { expr: "1 + 1", value: "2", options: ["1", "2", "3", "4"] },
      });
    return out;
  },
});
</script>

<script>
const log = [];
let failures = 0;

function check(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failures++;
  log.push((ok ? "PASS  " : "FAIL  ") + name +
    (ok ? "" : "\n        got  " + JSON.stringify(got) + "\n        want " + JSON.stringify(want)));
}
function section(title) { log.push("\n" + title); }

/* ==========================================================================
   STORE
   ========================================================================== */

function storeTests() {
  section("store");
  QStore.reset();
  log.push("  persistent storage: " + QStore.persistent);

  const qs = QBank.all();
  const a = qs[0], b = qs[1], c = qs[2];

  QStore.recordAttempt({ qid: a.id, mode: "practice", outcome: "wrong",   timeMs: 30000 });
  QStore.recordAttempt({ qid: a.id, mode: "practice", outcome: "correct", timeMs: 20000, hintUsed: true });
  QStore.recordAttempt({ qid: b.id, mode: "test", outcome: "wrong", answered: 2, timeMs: 40000, testId: "t1" });
  QStore.recordAttempt({ qid: b.id, mode: "practice", outcome: "wrong", timeMs: 50000 });
  QStore.recordAttempt({ qid: c.id, mode: "practice", outcome: "correct", timeMs: (c.time * 1000) + 60000 });

  const sa = QStore.questionStats(a.id, a);
  check("seen count", sa.seen, 2);
  check("accuracy ignores order", sa.accuracy, 0.5);
  check("median time", sa.medianTimeMs, 25000);
  check("hint rate", sa.hintRate, 0.5);

  check("review: last correct and in time, no", QStore.needsReview(a), false);
  check("review: last wrong, yes", QStore.needsReview(b), true);
  check("review: correct but over target, yes", QStore.needsReview(c), true);
  check("review: never attempted, no", QStore.needsReview(qs[10]), false);

  const o = QStore.overallStats(qs);
  check("attempted", o.attempted, 3);
  check("bank size", o.bankSize, qs.length);
  check("review count", o.reviewCount, 2);
  check("weakest ranks the always-wrong first", o.weakest[0].q.id, b.id);
  check("slowest ranks by ratio to target", o.slowest[0].q.id, c.id);
  check("ungraded has no accuracy", QStore.questionStats(qs[10].id, qs[10]).accuracy, null);

  QStore.setCursor({ category: "logic" }, 7);
  check("cursor stored per filter", QStore.getCursor({ category: "logic" }), 7);
  check("other filters unaffected", QStore.getCursor({ category: "probability" }), 0);

  const dump = QStore.exportJSON();
  QStore.reset();
  check("reset clears attempts", QStore.attempts().length, 0);

  const r1 = QStore.importJSON(dump);
  check("import succeeds", r1.ok, true);
  check("import restores every attempt", r1.added, 5);
  check("import restores stats", QStore.questionStats(a.id, a).accuracy, 0.5);
  check("import restores cursors", QStore.getCursor({ category: "logic" }), 7);

  const r2 = QStore.importJSON(dump);
  check("re-import adds nothing", [r2.added, r2.skipped], [0, 5]);
  check("invalid json refused", QStore.importJSON("{nope").ok, false);
  check("wrong shape refused", QStore.importJSON('{"hello":1}').ok, false);
  check("refused import leaves data alone", QStore.attempts().length, 5);

  const replaced = QStore.importJSON(dump, { merge: false });
  check("replace mode swaps wholesale", [replaced.ok, QStore.attempts().length], [true, 5]);

  QStore.reset();
}

/* ==========================================================================
   VALIDATOR
   ========================================================================== */

function validatorTests() {
  section("validator");
  const formats = QFormats.all();

  const clean = QValidate.validate({ questions: QBank.all(), formats, problems: QBank.problems() });
  check("real bank has no errors", clean.issues.filter(i => i.severity === "error").length, 0);

  const bad = QValidate.validate({
    formats,
    questions: [
      { id: "x", category: "c", difficulty: 1, time: 10, question: `q`, solution: `s`, hint: `h`,
        options: [`a`, `b`, `c`, `d`, `e`], answer: 9 },
      { id: "x", category: "c", difficulty: 1, time: 10, question: `q`, solution: `s`, hint: `h` },
      { id: "y", category: "c", difficulty: 7, time: 10, question: `unclosed $x`, solution: `s`, hint: `h` },
    ],
  });
  const messages = bad.issues.filter(i => i.severity === "error").map(i => i.field);
  check("catches out-of-range answer", messages.includes("answer"), true);
  check("catches duplicate id", messages.includes("id"), true);
  check("catches bad difficulty", messages.includes("difficulty"), true);
  check("catches unclosed $", messages.includes("question"), true);

  check("balanced inline maths is fine", QValidate.scanDelimiters("a $x$ b").dangling, null);
  check("balanced display maths is fine", QValidate.scanDelimiters("a $$x$$ b").dangling, null);
  check("escaped dollar is not a delimiter", QValidate.scanDelimiters("costs \\$5 today").dangling, null);
  check("unclosed display block caught",
    QValidate.scanDelimiters("$$x").dangling, "unclosed $$ display block");

  check("eligibility respects option count", QBank.ineligibleReason(
    { options: [`a`, `b`, `c`], answer: 0 }, { optionCount: 5 }), "has 3 options, format needs 5");
  check("eligibility passes a good question", QBank.ineligibleReason(
    { options: [`a`, `b`, `c`, `d`, `e`], answer: 4 }, { optionCount: 5 }), null);

  // Fencing a format's pool by category.
  const four = { category: "sequences", options: [`a`, `b`, `c`, `d`], answer: 0 };
  check("allow-list admits a listed category",
    QBank.isEligible(four, { optionCount: 4, categories: ["sequences"] }), true);
  check("allow-list refuses any other category",
    QBank.isEligible(four, { optionCount: 4, categories: ["logic"] }), false);
  check("block-list refuses a listed category",
    QBank.isEligible(four, { optionCount: 4, excludeCategories: ["sequences"] }), false);
  check("block-list admits any other category",
    QBank.isEligible(four, { optionCount: 4, excludeCategories: ["logic"] }), true);
  check("allow-list format sees only its category",
    QBank.eligible(QFormats.get("selftest-allow")).map(q => q.id), DRAW_ALL);
  check("block-list format sees none of it",
    QBank.eligible(QFormats.get("selftest-block")).length, 0);
  check("a generated format draws nothing from the bank",
    QBank.eligible(QFormats.get("flow-math")).length, 0);

  // The real formats: Flow papers stay Flow, and nothing leaks the other way.
  check("the sequences paper is generated too", QBank.eligible(QFormats.get("flow-sequences")).length, 0);
  check("Maven paper draws no drill questions", QBank.eligible(QFormats.get("maven-oa"))
    .some(q => q.category === "sequences" || q.category === "mental arithmetic"), false);
}

/* ==========================================================================
   GENERATED PAPERS
   ========================================================================== */

function generatorTests() {
  section("generated papers");
  const g = QGenerators.get("arithmetic-sprint");
  const f = QFormats.get("flow-math");
  check("the Flow maths format names a loaded generator", !!g, true);

  const paper = g.make(60);
  check("a paper is 60 questions", paper.length, 60);
  check("with 60 different ids", new Set(paper.map(q => q.id)).size, 60);
  check("and 60 different sums", new Set(paper.map(q => q.check.expr)).size, 60);
  check("four options each", paper.every(q => q.options.length === 4), true);
  check("integers, decimals and fractions all appear",
    ["integers", "decimals", "fractions"].every(c => paper.some(q => q.category === c)), true);

  // Re-mark 30 whole papers with the validator's own evaluator.
  const r = QValidate.checkGenerator(g, f, 30);
  check("1800 generated questions re-marked", r.sampled, 1800);
  check("every one keyed correctly, with exactly one right option", r.issues, []);

  // The re-marker itself has to be able to fail.
  check("re-marker evaluates a sum", (() => { const v = QValidate.evalCheck("(3/4) + 0.5"); return [String(v.n), String(v.d)]; })(), ["50", "40"]);
  const wrongKey = Object.assign({}, paper[0], { answer: (paper[0].answer + 1) % 4 });
  check("re-marker catches a wrong key", QValidate.checkGenerated(wrongKey, 4).length > 0, true);
  const twoRight = JSON.parse(JSON.stringify(paper[1]));
  twoRight.check.options[(twoRight.answer + 1) % 4] = twoRight.check.options[twoRight.answer];
  check("re-marker catches two correct options", QValidate.checkGenerated(twoRight, 4).length > 0, true);
  const mislabelled = JSON.parse(JSON.stringify(paper[2]));
  mislabelled.options[0] = "999999";
  check("re-marker catches an option that shows the wrong number",
    QValidate.checkGenerated(mislabelled, 4).length > 0, true);

  // The right answer must not favour a position among the sorted options.
  const rank = [0, 0, 0, 0];
  for (let i = 0; i < 40; i++) for (const q of g.make(60)) rank[q.answer]++;
  check("right answer is not hiding in the middle", rank.every(n => n > 2400 * 0.19 && n < 2400 * 0.31), true);

  const v = QValidate.validate({ questions: [], formats: [f], generators: [] });
  check("a format naming a missing generator is an error",
    v.issues.some(i => i.severity === "error" && i.field === "generator"), true);

  /* -- number series -- */
  const sg = QGenerators.get("number-series");
  const sf = QFormats.get("flow-sequences");
  check("the Flow sequences format names a loaded generator", !!sg, true);
  const sp = sg.make(26);
  check("a sequences paper is 26 questions", sp.length, 26);
  check("with 26 different series", new Set(sp.map(q => q.check.terms.join(","))).size, 26);
  check("no rule family more than twice in a paper", (() => {
    const n = {};
    for (const q of sp) n[q.check.rule.family] = (n[q.check.rule.family] || 0) + 1;
    return Math.max(...Object.keys(n).map(k => n[k]));
  })() <= 2, true);
  check("easier series first, harder last",
    sp.every((q, i) => i === 0 || q.difficulty >= sp[i - 1].difficulty), true);
  check("every family has an independent re-marker",
    sg.families.filter(name => QValidate.sequenceFamilies().indexOf(name) === -1), []);

  const sr = QValidate.checkGenerator(sg, sf, 40);
  check("1040 generated series re-marked", sr.sampled, 1040);
  check("every one agrees with the second implementation of its rule", sr.issues, []);

  // One series of every family, asked for by name, so none can go untested.
  const families = {};
  for (const name of sg.families) {
    const made = sg.make(4, Math.random, [name]);
    families[name] = made.length === 4 && made.every(q => q.check.rule.family === name)
      && made.every(q => QValidate.checkGenerated(q, 4).length === 0);
  }
  check("all 27 families make valid series on request",
    [Object.keys(families).length, Object.keys(families).filter(k => !families[k])], [27, []]);

  // The re-marker has to be able to fail here as well.
  const s0 = sp[0];
  check("series re-marker catches a wrong key",
    QValidate.checkGenerated(Object.assign({}, s0, { answer: (s0.answer + 1) % 4 }), 4).length > 0, true);
  const badTerm = JSON.parse(JSON.stringify(s0));
  badTerm.check.terms[1] = String(Number(badTerm.check.terms[1].split("/")[0]) + 1);
  check("series re-marker catches a shown term the rule does not give",
    QValidate.checkGenerated(badTerm, 4).length > 0, true);
  const badRule = JSON.parse(JSON.stringify(s0));
  badRule.check.rule.family = "no-such-family";
  check("series re-marker refuses a rule it does not know",
    QValidate.checkGenerated(badRule, 4).length > 0, true);
  const badShow = JSON.parse(JSON.stringify(s0));
  badShow.question = badShow.question.replace(/<span class="term">[^<]*<\/span>/, '<span class="term">424242</span>');
  check("series re-marker catches a question that shows different terms",
    QValidate.checkGenerated(badShow, 4).length > 0, true);

  const srank = [0, 0, 0, 0];
  for (let i = 0; i < 60; i++) for (const q of sg.make(26)) srank[q.answer]++;
  check("the right answer is not hiding in the middle here either",
    srank.every(n => n > 1560 * 0.19 && n < 1560 * 0.31), true);
}

/* ==========================================================================
   PRACTICE VIEW
   ========================================================================== */

const $ = sel => document.querySelector(sel);
const key = k => document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true }));

function setSelect(sel, value) {
  const node = $(sel);
  node.value = value;
  node.dispatchEvent(new Event("change", { bubbles: true }));
}

function practiceTests() {
  section("practice view");
  QStore.reset();
  QApp.start();                 // installs the keyboard listener the tests use
  QApp.go("practice", { force: true });

  setSelect("#mode", "sequential");
  setSelect("#category", "selftest");

  check("sequential starts at the first question", $("#question").textContent.includes("Which is two?"), true);
  check("options are rendered", $("#options").querySelectorAll(".option").length, 4);
  check("option list is visible for MCQ", $("#options").hidden, false);

  // Answer correctly by matching text, since display order is shuffled.
  const buttons = [...$("#options").querySelectorAll(".option")];
  buttons.filter(b => b.querySelector(".text").textContent === "two")[0].click();

  check("correct answer recorded", QStore.questionStats("st-mc").correct, 1);
  check("grading marks the right option", $("#options").querySelector(".correct .text").textContent, "two");
  check("answering locks the options", buttons.every(b => b.disabled), true);
  check("solution opens after grading", $("#solution").classList.contains("open"), true);
  check("auto-revealed solution is not counted as looked up",
    QStore.attemptsFor("st-mc")[0].solutionShown, false);
  check("no self-grade prompt for multiple choice", $("#selfgrade").hidden, true);

  buttons.filter(b => b.querySelector(".text").textContent === "four")[0].click();
  check("a second click cannot overwrite the grade", QStore.attemptsFor("st-mc").length, 1);

  key("n");
  check("next moves to the second question", $("#question").textContent.includes("Free response one"), true);
  check("options hidden for free response", $("#options").hidden, true);

  key("g");
  check("self-grade records correct", QStore.questionStats("st-free-1").correct, 1);
  check("self-grade without revealing does not mark it looked up",
    QStore.attemptsFor("st-free-1")[0].solutionShown, false);

  key("n");
  key("s");
  check("solution reveal shows the self-grade prompt", $("#selfgrade").hidden, false);
  key("m");
  check("missed it records wrong", QStore.questionStats("st-free-2").wrong, 1);
  check("revealed solution is recorded", QStore.attemptsFor("st-free-2")[0].solutionShown, true);

  check("review set now holds the wrong one",
    QStore.reviewSet(QBank.filter({ category: "selftest" })).map(q => q.id), ["st-free-2"]);

  // Moving on without touching anything must not record an attempt.
  const before = QStore.attempts().length;
  key("n"); key("n");
  check("browsing records nothing", QStore.attempts().length, before);

  // Sequential position survives a remount.
  const at = $("#status").textContent.match(/^(\d+) of/)[1];
  QApp.go("practice", { force: true });
  setSelect("#mode", "sequential");
  setSelect("#category", "selftest");
  check("sequential resumes where it left off", $("#status").textContent.startsWith(at + " of"), true);

  // Review mode serves only the failed question.
  setSelect("#mode", "review");
  check("review mode serves the failed question",
    $("#question").textContent.includes("Free response two"), true);

  QStore.reset();
}

/* ==========================================================================
   TEST VIEW
   ========================================================================== */

/* Click the option whose visible text matches, since display order is shuffled. */
function clickOption(text) {
  const button = [...document.querySelectorAll("#options .option")]
    .filter(b => b.querySelector(".text").textContent === text)[0];
  if (!button) throw new Error("no option reading " + text);
  button.click();
}

/* An answer-is-final paper: the stub generator, then the real Flow format. */
function sprintTests() {
  section("answer-is-final papers");
  QStore.reset();
  const realConfirm = window.confirm;
  window.confirm = () => true;

  try {
    QApp.go("test", { force: true });
    const again = $("#again");
    if (again) again.click();
    check("generated format has a start button", !!$('[data-generate="selftest-sprint"]'), true);
    check("the Flow maths test is offered", !!$('[data-generate="flow-math"]'), true);
    check("the Flow sequences test is offered", !!$('[data-generate="flow-sequences"]'), true);

    $('[data-generate="selftest-sprint"]').click();
    check("sprint starts on question 1", $(".controls").textContent.includes("Question 1 of 4"), true);
    check("no previous, next, clear or flag", [$("#prev"), $("#next"), $("#clear"), $("#flag")], [null, null, null, null]);
    check("no palette", $("#palette"), null);

    key("ArrowRight"); key("n");
    check("navigation keys cannot skip a question", $(".controls").textContent.includes("Question 1 of 4"), true);

    clickOption("2");
    check("answering moves straight on", $(".controls").textContent.includes("Question 2 of 4"), true);
    key("ArrowLeft"); key("p"); key("0");
    check("and there is no way back", $(".controls").textContent.includes("Question 2 of 4"), true);
    check("nothing is pre-selected on the new question",
      document.querySelectorAll('#options .option[aria-pressed="true"]').length, 0);

    clickOption("1");
    clickOption("2");
    check("three answered, on the last question", $(".controls").textContent.includes("Question 4 of 4"), true);

    $("#finish").click();                       // end early: question 4 never answered
    check("ending early scores +1 +1 -1 and 0 for the unreached",
      $("#view").textContent.includes("1 out of 4"), true);
    check("results call it not reached", /1 not reached/.test($("#view").textContent), true);
    check("results break the marks down by kind", $("#view").textContent.includes("Where the marks went"), true);
    check("unreached questions are not listed", document.querySelectorAll("#view details").length, 3);

    check("generated questions stay out of the question history", QStore.attempts().length, 0);
    const t = QStore.tests()[0];
    check("the paper itself is in the test history",

/* Sit a paper start to finish, answering nothing, and report which questions
   it drew. The run's stored items are the only place the ids are exposed. */
function sitPaper(formatId) {
  QApp.go("test", { force: true });
  const again = $("#again");
  if (again) again.click();               // leave a results screen from last time
  const start = $('[data-start="' + formatId + '"]');
  if (!start) throw new Error("cannot start " + formatId);
  start.click();
  key("r");                               // free navigation: to the review screen
  $("#submit").click();
  const runs = QStore.tests();
  return runs[runs.length - 1].items.map(i => i.qid);
}

function markSeen(ids) {
  for (const id of ids)
    QStore.recordAttempt({ qid: id, mode: "practice", outcome: "correct", timeMs: 1000 });
}

function drawTests() {
  section("paper selection");
  const realConfirm = window.confirm;
  window.confirm = () => true;

  try {
    // Three of the five already attempted, two never seen. A three-question
    // paper should take both unseen ones and exactly one of the rest.
    QStore.reset();
    markSeen(DRAW_SEEN);
    let drawn = sitPaper("selftest-draw");

    check("paper is the requested length", drawn.length, 3);
    check("paper holds no duplicates", new Set(drawn).size, drawn.length);
    check("every unseen question is used first",
      DRAW_UNSEEN.every(id => drawn.includes(id)), true);
    check("only as many seen questions as needed to fill up",
      drawn.filter(id => DRAW_SEEN.includes(id)).length, 1);

    // Same again with categoryWeights, which takes a different path.
    QStore.reset();
    markSeen(DRAW_SEEN);
    drawn = sitPaper("selftest-draw-weighted");

    check("weighted paper holds no duplicates", new Set(drawn).size, drawn.length);
    check("weighted paper is the requested length", drawn.length, 3);
    check("weighted paper prefers the unseen too",
      DRAW_UNSEEN.every(id => drawn.includes(id)), true);

    // Nothing left unseen: it must still fill a full paper, without repeats.
    QStore.reset();
    markSeen(DRAW_ALL);
    drawn = sitPaper("selftest-draw");

    check("a fully-seen bank still fills the paper", drawn.length, 3);
    check("and still without duplicates", new Set(drawn).size, drawn.length);
    check("drawing only from what is eligible",
      drawn.every(id => DRAW_ALL.includes(id)), true);

    // Sitting two papers back to back should move on to fresh questions.
    QStore.reset();
    const first = sitPaper("selftest-draw");
    const second = sitPaper("selftest-draw");
    check("a second paper uses the questions the first left alone",
      second.filter(id => !first.includes(id)).length, 2);
  } finally {
    window.confirm = realConfirm;
    QStore.reset();
  }
}

function interviewTests() {
  section("mock interview");
  const realConfirm = window.confirm;
  window.confirm = () => true;

  const F = QFormats.get("wincent-interview");
  const testView = QApp.views().filter(v => v.name === "test")[0];
  const last = () => { const t = QStore.tests(); return t[t.length - 1]; };
  const norm = t => t.replace(/\s+/g, " ").trim();
  const textOf = html => { const d = document.createElement("div"); d.innerHTML = html; return norm(d.textContent); };
  const begin = () => {
    QApp.go("test", { force: true });
    if ($("#again")) $("#again").click();             // a paper's results from an earlier check
    if ($("#mock-back")) $("#mock-back").click();
    $('[data-interview="wincent-interview"]').click();
  };
  const solve = right => { $("#answer").click(); $('[data-mark="' + (right ? 1 : 0) + '"]').click(); };
  const where = () => $(".controls") ? norm($(".controls").textContent) : "";
  const partName = () => norm($(".interview .meta").textContent);
  const clues = () => document.querySelectorAll(".clues li").length;

  try {
    /* -- the problems -- */
    const openings = QBank.all().filter(q => QBank.isInterviewProblem(q));
    check("six opening problems at each level",
      [1, 2, 3].map(l => QBank.interviewProblems(l).length), [6, 6, 6]);
    check("every one has a follow-up with its own answer, solution and clues", openings.every(q => {
      const n = QBank.get(q.interview.followUp);
      return !!n && !n.interview && !!n.shortAnswer && !!n.solution && Array.isArray(n.hints) && n.hints.length >= 2;
    }), true);
    check("no follow-up is shared between two problems",
      new Set(openings.map(q => q.interview.followUp)).size, openings.length);
    check("the first clue doubles as the practice hint",
      QBank.all().filter(q => Array.isArray(q.hints)).every(q => q.hint === q.hints[0]), true);
    check("the interview format draws exactly the opening problems", QBank.eligible(F).length, 18);
    check("no interview question can be drawn into a multiple-choice paper",
      QFormats.all().filter(f => !f.interview && !f.generator)
        .every(f => QBank.eligible(f).every(q => !q.hints && !q.interview && !q.shortAnswer)), true);

    /* -- the validator's rules for them -- */
    const errorsIn = list => QValidate.validate({ questions: list, formats: [] }).issues
      .filter(i => i.severity === QValidate.ERROR).map(i => i.field);
    const base = { category: "x", difficulty: 1, time: 60, question: "q", hint: "h", hints: ["h"],
      solution: "s", shortAnswer: "a" };
    const follow = Object.assign({}, base, { id: "f" });
    const opening = extra => Object.assign({}, base, { id: "o", interview: { level: 1, followUp: "f", twist: "t" } }, extra);
    check("a sound opening problem and follow-up pass", errorsIn([opening(), follow]), []);
    check("a follow-up that is not in the bank is an error", errorsIn([opening()]), ["interview"]);
    check("so is an opening problem with options",
      errorsIn([opening({ options: ["a", "b"], answer: 0 }), follow]).includes("interview"), true);
    check("so is a level outside 1 to 3",
      errorsIn([opening({ interview: { level: 4, followUp: "f", twist: "t" } }), follow]), ["interview"]);
    check("so is a follow-up with no short answer",
      errorsIn([opening(), Object.assign({}, follow, { shortAnswer: undefined })]), ["interview"]);
    check("so is an opening problem with no twist",
      errorsIn([opening({ interview: { level: 1, followUp: "f" } }), follow]), ["interview"]);

    /* -- every block cleared -- */
    QStore.reset();
    begin();
    check("the mock opens on block 1", /Block 1 of 3/.test(where()), true);
    check("with the opening problem", partName(), "Opening problem");
    check("nothing to mark against is visible yet",
      [!!$("#shortanswer"), document.querySelectorAll("[data-mark]").length, clues()], [false, 0, 0]);
    $("#clue").click();
    check("asking for a clue shows one", clues(), 1);
    $("#clue").click();
    check("and asking again shows the next", clues(), 2);
    $("#answer").click();
    check("checking shows the answer and the two ways to mark it",
      [!!norm($("#shortanswer").textContent), document.querySelectorAll("[data-mark]").length, !!$("#clue")],
      [true, 2, false]);
    const first = QInterview.state().run.blocks[0];
    $('[data-mark="1"]').click();
    check("solving the opening problem brings its follow-up",
      [partName(), /Block 1 of 3/.test(where()), !!$(".earlier")], ["Follow-up", true, true]);
    check("put as a twist on the problem still on the table",
      [norm($("#qtext").textContent), norm($(".earlier").textContent).includes(textOf(QBank.get(first.parts[0].qid).question))],
      [textOf(QBank.get(first.parts[0].qid).interview.twist), true]);
    $("#clue").click();
    check("the follow-up has its own clues",
      norm($(".clues li").textContent), textOf(QBank.get(first.parts[1].qid).hints[0]));
    solve(false);
    check("a missed follow-up still moves on to block 2",
      [/Block 2 of 3/.test(where()), partName()], [true, "Opening problem"]);
    solve(true); solve(true);
    check("then block 3", /Block 3 of 3/.test(where()), true);
    solve(true); solve(true);
    check("clearing every block ends on the results", $("h2").textContent, "You cleared all 3 blocks");
    const a = last();
    check("stored as a sitting: five of six parts solved",
      [a.formatId, a.score, a.max, a.counts], ["wincent-interview", 5, 6, { correct: 5, wrong: 1, skipped: 0 }]);
    check("with what the interview came to",
      a.interview, { blocks: 3, cleared: 3, stoppedAt: null, practisedOn: false });
    check("each part filed under its block", a.items.map(i => i.kind),
      ["block 1", "block 1", "block 2", "block 2", "block 3", "block 3"]);
    check("clues taken are kept", [a.items[0].clues, a.items[1].clues, a.items[2].clues], [2, 1, 0]);
    check("no problem appears twice in a mock", new Set(a.items.map(i => i.qid)).size, 6);
    check("blocks come at rising levels",
      a.items.filter((x, i) => i % 2 === 0).map(i => QBank.get(i.qid).interview.level), [1, 2, 3]);
    check("each follow-up belongs to its opening problem",
      [0, 2, 4].every(i => QBank.get(a.items[i].qid).interview.followUp === a.items[i + 1].qid), true);
    const history = QStore.attempts();
    check("all six problems go into the question history",
      [history.length, history.every(x => x.mode === "test" && x.testId === a.id),
       history[0].hintUsed, history[2].hintUsed, history[1].outcome], [6, true, true, false, "wrong"]);
    check("results give every problem with its answer and solution",
      [document.querySelectorAll(".detail").length, norm($("#view").textContent).includes(textOf(QBank.get(a.items[5].qid).shortAnswer))],
      [6, true]);
    check("a finished mock can be left without a prompt", testView.canLeave(), null);

    QApp.go("stats", { force: true });
    const panel = $('[data-paper="wincent-interview"]');
    check("the stats tab gives the mock its own panel",
      [!!panel, !!panel && /cleared\s+3 of 3 blocks/.test(panel.textContent), !!panel && /latest\s+5 \/ 6/.test(panel.textContent)],
      [true, true, true]);
    QApp.go("test", { force: true });
    check("coming back to the tab shows the results again", $("h2").textContent, "You cleared all 3 blocks");

    /* -- the gate closes -- */
    QStore.reset();
    begin();
    solve(true); solve(true); solve(false);
    check("missing an opening problem ends the interview", $("h2").textContent, "The interview would end here");
    check("which is still open until you choose", testView.canLeave() !== null, true);
    $("#see-results").click();
    check("the results say where it stopped", $("h2").textContent, "Stopped at block 2 of 3");
    const b = last();
    check("only what was sat is scored", [b.score, b.max, b.counts, b.interview],
      [2, 6, { correct: 2, wrong: 1, skipped: 3 }, { blocks: 3, cleared: 1, stoppedAt: 2, practisedOn: false }]);
    check("three problems in the history, and the unopened block's problem still unseen",
      [QStore.attempts().length, QStore.attemptedIds().has(b.items[4].qid)], [3, false]);

    /* -- the next mock, and running out of time -- */
    const seenBefore = QStore.attemptedIds();
    begin();
    check("the next mock takes opening problems not attempted yet",
      QInterview.state().run.blocks.every(bl => !seenBefore.has(bl.parts[0].qid)), true);
    check("leaving mid-interview asks first", /mock interview is in progress/.test(testView.canLeave() || ""), true);
    QInterview.finish();
    check("the clock running out ends it where it stands", $("h2").textContent, "Time ran out in block 1 of 3");
    const t = last();
    check("with nothing scored and nothing added to the history",
      [t.score, t.counts, t.autoSubmitted, QStore.attempts().length], [0, { correct: 0, wrong: 0, skipped: 6 }, true, 3]);
    $("#mock-again").click();
    check("another mock starts straight from the results", /Block 1 of 3/.test(where()), true);
    QInterview.finish();
    $("#mock-back").click();
    check("and the results lead back to the list of tests", !!$('[data-interview="wincent-interview"]'), true);

    /* -- carrying on for practice -- */
    QStore.reset();
    begin();
    solve(false);
    check("the gate can close on block 1", $("h2").textContent, "The interview would end here");
    $("#carry-on").click();
    check("carrying on opens block 2, marked as practice",
      [/Block 2 of 3/.test(where()), /practice only/.test(where())], [true, true]);
    solve(true); solve(true);
    check("practice runs on into block 3", /Block 3 of 3/.test(where()), true);
    solve(false);
    check("and ends on the results, still stopped at block 1", $("h2").textContent, "Stopped at block 1 of 3");
    const c = last();
    check("nothing practised is scored", [c.score, c.counts, c.interview],
      [0, { correct: 0, wrong: 1, skipped: 5 }, { blocks: 3, cleared: 0, stoppedAt: 1, practisedOn: true }]);
    check("but it is kept on the record and in the history",
      [c.items.map(i => i.practised), QStore.attempts().length],
      [[null, null, "correct", "correct", "wrong", null], 4]);

    /* -- missing the last block -- */
    QStore.reset();
    begin();
    solve(true); solve(true); solve(true); solve(true); solve(false);
    check("missing the last block goes straight to the results", $("h2").textContent, "Stopped at block 3 of 3");
    check("two blocks cleared", last().interview, { blocks: 3, cleared: 2, stoppedAt: 3, practisedOn: false });

    /* -- keyboard -- */
    QStore.reset();
    begin();
    key("y");
    check("marking keys do nothing before the answer is shown", partName(), "Opening problem");
    key("c");
    check("C asks for a clue", clues(), 1);
    while (!$("#clue").disabled) key("c");
    check("clues stop when they run out",
      [clues(), norm($("#clue").textContent)],
      [QBank.get(QInterview.state().run.blocks[0].parts[0].qid).hints.length, "No more clues"]);
    key("a");
    check("A checks the answer", !!$("#shortanswer"), true);
    key("y");
    check("Y marks it solved", partName(), "Follow-up");
    key("a"); key("n");
    check("N marks it missed", /Block 2 of 3/.test(where()), true);
    QInterview.finish();
    $("#mock-back").click();

    QApp.go("bank", { force: true });
    check("the bank view shows the interview as ready",
      /Wincent quant interview[\s\S]*ready — 6 \/ 6 \/ 6 opening problems/.test($("#view").textContent), true);
  } finally {
    window.confirm = realConfirm;
    QStore.reset();
  }
}

function formatCheckTests() {
  section("format checks");
  check("malformed format fields are refused", (() => {
    const before = QFormats.all().length;
    QFormats.add([{ id: "bad-1", name: "x", questionCount: 1, timeLimitSec: 1, optionCount: 4,
      marking: { correct: 1, incorrect: 0, skipped: 0 }, navigation: "free", mustAnswer: true }]);
    QFormats.add([{ id: "bad-2", name: "x", questionCount: 1, timeLimitSec: 1, optionCount: 4,
      marking: { correct: 1, incorrect: 0, skipped: 0 }, navigation: "free", categories: "sequences" }]);
    QFormats.add([{ id: "bad-3", name: "x", timeLimitSec: 60, interview: { blocks: [] } }]);
    QFormats.add([{ id: "bad-4", name: "x", timeLimitSec: 60, interview: { blocks: [{ level: 4, minutes: 5 }] } }]);
    QFormats.add([{ id: "bad-5", name: "x", interview: { blocks: [{ level: 1, minutes: 5 }] } }]);
    QFormats.add([{ id: "bad-6", name: "x", timeLimitSec: 60, interview: { blocks: [{ level: 1 }] } }]);
    return QFormats.all().length - before;
  })(), 0);
}

window.addEventListener("load", () => {
  try {
    storeTests();
    validatorTests();
    practiceTests();
    testViewTests();
    sprintTests();
    interviewTests();
    drawTests();
    generatorTests();
    dashboardTests();
    formatCheckTests();
  } catch (e) {
    failures++;
    log.push("\nTHREW  " + (e && e.stack ? e.stack : e));
  }
  document.getElementById("out").textContent =
    log.join("\n") + "\n\n" + (failures ? failures + " failure(s)" : "all checks passed");
});
