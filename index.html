<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant practice</title>

<!-- Optional: LaTeX rendering. Works when online; if offline, maths shows as raw $...$ text. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
  :root {
    --bg: #0f1b2d;          /* deep navy page */
    --panel: #162640;       /* question panel */
    --panel-edge: #24395a;
    --ink: #e8edf5;
    --muted: #8a9bb8;
    --accent: #6fa8ff;      /* soft blue, used sparingly */
    --accent-ink: #0f1b2d;
    --good: #6fd08c;
    --bad: #ff7a7a;
    --warn: #e6b450;
    --series: #5a94ee;      /* the one chart line: a step of the accent that sits
                               in the readable lightness band on the panel */
    --serif: "Charter", "Iowan Old Style", "Georgia", "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg); color: var(--ink); }

  body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.55;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }
  /* The dashboard and the test palette need more room than a column of prose. */
  body.wide { max-width: 58rem; }

  /* Top bar: title on the left, view tabs on the right */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 2rem;
  }
  header h1 { font-family: var(--serif); font-size: 22px; font-weight: 400; margin: 0; color: var(--ink); }

  .tabs { display: flex; gap: .25rem; }
  .tabs a {
    color: var(--muted); text-decoration: none;
    padding: 5px 11px; border-radius: 6px; border: 1px solid transparent;
  }
  .tabs a:hover { color: var(--ink); border-color: var(--panel-edge); }
  .tabs a[aria-current="page"] { color: var(--ink); background: var(--panel); border-color: var(--panel-edge); }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Controls above the panel: mode and filters */
  .controls {
    display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
    font-family: var(--sans); font-size: 14px; color: var(--muted);
    margin-bottom: 1.25rem;
  }
  .controls .spacer { margin-left: auto; }

  select, input[type="text"] {
    font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  select:hover { border-color: var(--muted); }
  select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The question sits in a single panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 2rem 2.25rem;
  }
  .panel + .panel { margin-top: 1rem; }
  #question { min-height: 7rem; }
  #question p:first-child { margin-top: 0; }
  #question p:last-child  { margin-bottom: 0; }
  .meta {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    font-family: var(--sans); font-size: 13px; color: var(--accent); margin-bottom: 1rem;
  }
  .meta .tags { color: var(--muted); }

  /* Timer: elapsed / target. Amber near the target, red past it. */
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  .timer .target { opacity: .7; }
  .timer.warn { color: var(--warn); }
  .timer.over { color: var(--bad); }
  .timer.done { color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .timer.over .elapsed { animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse { 50% { opacity: .45; } }
  .empty { color: var(--muted); }
  .empty code { font-size: 0.9em; color: var(--ink); }

  /* Multiple-choice options */
  .options { list-style: none; margin: 1.5rem 0 0; padding: 0; }
  .options li { margin-top: .5rem; }
  .option {
    display: flex; gap: .75rem; align-items: baseline; width: 100%; text-align: left;
    font-family: var(--serif); font-size: inherit; line-height: 1.5;
    background: none; color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: .65rem .9rem; cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--muted); }
  .option .key {
    font-family: var(--sans); font-size: 13px; color: var(--muted);
    border: 1px solid var(--panel-edge); border-radius: 4px;
    min-width: 1.6em; text-align: center; padding: 1px 0; flex: none;
  }
  .option[aria-pressed="true"] { border-color: var(--accent); }
  .option[aria-pressed="true"] .key { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .option.correct { border-color: var(--good); }
  .option.correct .key { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
  .option.wrong { border-color: var(--bad); }
  .option.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
  .option:disabled { cursor: default; opacity: 1; }
  .option.muted:disabled { opacity: .55; }

  /* Generated arithmetic: fractions are stacked in plain CSS rather than KaTeX,
     so a sprint question paints instantly and reads the same offline. */
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; font-size: .85em; margin: 0 .1em; }
  .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 .25em; }
  .frac span:last-child { padding: 0 .25em; }
  .sum { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* A generated number series: big enough to study, and free to wrap. */
  .seq { font-size: 28px; line-height: 1.6; margin-top: .5rem; font-variant-numeric: tabular-nums; }
  .seq .term { white-space: nowrap; }
  .seq .next { color: var(--accent); }
  details .seq { font-size: 20px; }
  /* A sprint question is one sum: make it the biggest thing on the page. */
  .sprint #qtext { font-size: 34px; text-align: center; padding: .75rem 0 .25rem; }
  .sprint .options { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .sprint .options li { margin-top: 0; }
  .sprint .option { font-size: 22px; padding: .8rem .9rem; align-items: center; }

  /* Score-per-sitting line on the Stats tab. One series, so no legend: the
     panel heading says what is plotted, and every point is a row of the Test
     history table. Grid and axis text stay recessive; only the line is loud. */
  .chart { position: relative; margin: .5rem 0 1rem; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid { stroke: var(--panel-edge); stroke-width: 1; }
  .chart .zero { stroke: var(--muted); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--series); stroke: var(--panel); stroke-width: 2; }
  .chart .dot.on { stroke: var(--ink); }
  .chart .hit { fill: transparent; cursor: default; outline: none; }
  .chart .tick { fill: var(--muted); font-family: var(--sans); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .endlabel { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 600; }
  .chart .tip {
    position: absolute; transform: translate(12px, -50%); pointer-events: none; z-index: 2;
    background: var(--bg); border: 1px solid var(--panel-edge); border-radius: 6px; padding: .4rem .6rem;
    font-family: var(--sans); font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chart .tip.flip { transform: translate(calc(-100% - 12px), -50%); }
  .chart .tip b { display: block; color: var(--ink); font-size: 14px; }
  .chart .tip span { display: block; }
  table.kinds td.barcell { width: 22%; }
  .paper h2:first-child { margin-top: 0; }

  /* Hint / solution unfold beneath the question */
  .reveal { display: none; border-top: 1px solid var(--panel-edge); margin-top: 1.75rem; padding-top: 1.5rem; }
  .reveal.open { display: block; }
  .reveal .label { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-bottom: .5rem; }
  .reveal p:last-child { margin-bottom: 0; }

  /* Self-grading, for free-response questions */
  .selfgrade {
    display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap;
    font-family: var(--sans); font-size: 14px; color: var(--muted);
    border-top: 1px solid var(--panel-edge); margin-top: 1.5rem; padding-top: 1.25rem;
  }
  .selfgrade .done { color: var(--muted); }
  .selfgrade .done b { font-weight: 400; color: var(--ink); }

  /* Controls */
  nav.actions { margin-top: 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; font-family: var(--sans); font-size: 15px; }
  button {
    font: inherit; font-family: var(--sans); color: var(--ink);
    background: none; border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 8px 16px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { color: var(--muted); border-color: var(--panel-edge); cursor: default; opacity: .6; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .danger { border-color: #5c2b2b; color: #ffb4b4; }
  .danger:hover:not(:disabled) { border-color: var(--bad); }
  nav.actions .right { margin-left: auto; }

  footer { margin-top: 3rem; font-family: var(--sans); font-size: 13px; color: var(--muted); }
  kbd {
    font-family: var(--sans); font-size: 12px;
    border: 1px solid var(--panel-edge); border-radius: 4px; padding: 1px 5px;
    color: var(--ink);
  }

  /* A line of notice above the content: no storage, no KaTeX, test in progress */
  .banner {
    font-family: var(--sans); font-size: 13px;
    border: 1px solid var(--panel-edge); border-left: 3px solid var(--warn);
    border-radius: 6px; padding: .6rem .9rem; margin-bottom: 1rem; color: var(--muted);
  }
  .banner b { color: var(--ink); font-weight: 400; }

  /* Tables, used by the dashboard, the results screen and the bank view */
  table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 14px; }
  th, td { text-align: left; padding: .4rem .6rem .4rem 0; vertical-align: baseline; }
  th { color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--panel-edge); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr + tr td { border-top: 1px solid rgba(36,57,90,.5); }

  h2 { font-family: var(--serif); font-weight: 400; font-size: 19px; margin: 2rem 0 .75rem; }
  h2:first-child { margin-top: 0; }
  .subtle { color: var(--muted); font-family: var(--sans); font-size: 13px; }

  .good { color: var(--good); }
  .bad  { color: var(--bad); }
  .warnc { color: var(--warn); }

  /* Question palette in test mode */
  .palette { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
  .palette button {
    font-family: var(--sans); font-size: 13px; padding: 0;
    width: 2.1rem; height: 2.1rem; border-radius: 6px; position: relative;
  }
  .palette button.answered { background: var(--panel-edge); color: var(--ink); }
  .palette button.current { border-color: var(--accent); color: var(--accent); }
  .palette button.flagged::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--warn);
  }
  .legend { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-top: .75rem; display: flex; gap: 1rem; flex-wrap: wrap; }

  /* Expandable question + solution, used on the results screen */
  details { margin: .1rem 0; }
  details summary { cursor: pointer; }
  details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details[open] summary { margin-bottom: .5rem; }
  .detail { font-family: var(--serif); font-size: 17px; padding: .25rem 0 1.25rem; }
  .detail .options { margin-top: .75rem; }
  .detail .reveal { display: block; }

  /* Bank view: the id lists under each category */
  .detail-ids { font-family: var(--sans); font-size: 12px; line-height: 2; word-break: break-word; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; color: var(--ink); }
  td.barcell { width: 40%; min-width: 6rem; }

  /* Horizontal proportion bar, used for accuracy by category */
  .bar { display: block; height: 4px; border-radius: 2px; background: var(--panel-edge); margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); min-width: 2px; }

  @media (max-width: 480px) {
    body { font-size: 17px; padding-top: 2rem; }
    body.wide { max-width: none; }
    .panel { padding: 1.5rem 1.25rem; }
    nav.actions .right { margin-left: 0; }
    header { margin-bottom: 1.25rem; }
  }
</style>
</head>

<body>

<header>
  <h1>Quant practice</h1>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>

<footer id="status"></footer>

<!-- Registry first, then every bank file. ------------------------------------
     TO ADD A BANK FILE: put it in questions/, have it call QBank.add([...]),
     and add one <script> tag to the list below. That is the whole procedure. -->
<script src="bank.js"></script>
<script src="validate-core.js"></script>
<script src="formats.js"></script>
<script src="gen-arithmetic.js"></script>
<script src="gen-sequences.js"></script>
<script src="questions/questions.js"></script>
<script src="questions/questions-maven.js"></script>
<script src="questions/questions-flow-arithmetic.js"></script>
<script src="questions/questions-flow-sequences.js"></script>

<!-- App. store.js and app.js before the views, which register themselves. -->
<script src="store.js"></script>
<script src="app.js"></script>
<script src="view-practice.js"></script>
<script src="view-test.js"></script>
<script src="view-stats.js"></script>
<script src="view-bank.js"></script>

<script>QApp.start();</script>

</body>
</html>
